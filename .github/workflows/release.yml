name: Release

# Manual, on-demand release: pick a tag from the Actions tab (or `gh workflow
# run release.yml -f version=vX.Y.Z`) and this builds + publishes binaries.
#
# Windows is intentionally not built here: go-fuse (this project's FUSE
# binding) only supports Linux and macOS. A Windows build would need a
# different library (e.g. cgofuse + WinFsp) and isn't a drop-in addition.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.2.0)"
        required: true
      notes:
        description: "Release description (Markdown). Leave blank to auto-generate from commits instead."
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: GOOS=linux go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          build() {
            echo "Building $1/$2"
            GOOS="$1" GOARCH="$2" go build -o "dist/gdunion-$1-$2" ./cmd/gdunion
          }
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64

      - name: Checksum binaries
        # install.sh downloads this alongside the binary and refuses to
        # install unless the download's hash matches an entry here - run
        # from inside dist/ so the recorded filenames have no "dist/"
        # prefix, matching what install.sh looks up (plain "gdunion-<os>-
        # <arch>").
        run: (cd dist && sha256sum gdunion-* > SHA256SUMS)

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -eu
          if [ -n "$NOTES" ]; then
            gh release create "$VERSION" dist/* --title "$VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes
          fi
